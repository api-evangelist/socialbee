      - Content Scheduling
      - Content Recycling
      - Analytics
    properties:
      - type: Documentation
        url: https://help.socialbee.com/
      - type: Integrations
        url: https://socialbee.com/integrations/
      - type: ZapierIntegration
        url: https://zapier.com/apps/socialbee/integrations
      - type: Pricing
        url: https://socialbee.com/pricing/
      - type: StatusPage
        url: https://status.socialbee.com/
      - type: ChangeLog
        url: https://changelog.socialbee.com/
  - aid: socialbee:socialbee-mcp
    name: SocialBee MCP Server
    description: Undocumented but live first-party Model Context Protocol server mounted
      in the WordPress REST namespace of socialbee.com. Discoverable entirely through
      standards — an RFC 9728 protected resource metadata document names the endpoint and
      an RFC 8414 authorization server metadata document describes the OAuth 2.1
      authorization code + PKCE (S256) flow that guards it, with a single scope "mcp".
      An anonymous JSON-RPC tools/list returns a well-formed MCP 401 (mcp_unauthorized),
      confirming a real MCP implementation; the tool set itself is auth-gated and has not
      been enumerated. Note this is an agent surface over the WordPress content property,
      not over the SocialBee scheduling product.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://socialbee.com
    baseURL: https://socialbee.com/wp-json/mcp/mcp-oauth-server
    tags:
      - MCP
      - Model Context Protocol
      - Agent Surface
      - OAuth
    properties:
