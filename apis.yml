apis:
  - aid: socialbee:socialbee-api
    name: SocialBee API
    description: SocialBee platform API for managing social media posts, content categories,
      scheduling, recycling evergreen content, and accessing analytics across major
      social networks. Currently accessible via Zapier, Make, and Pabbly automation
      connectors; a public REST API is planned for the future.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://socialbee.com
    baseURL: https://app.socialbee.com
    tags:
