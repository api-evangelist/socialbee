aid: socialbee
name: SocialBee
description: SocialBee is an AI-powered social media management platform for creating,
  scheduling, recycling and analyzing content across Facebook, Instagram, X (Twitter),
  LinkedIn, TikTok, Pinterest, YouTube, Threads, Bluesky and Google Business Profiles,
  built around content categories and evergreen post recycling with AI caption generation.
  SocialBee publishes NO public REST API — its own help center states a public API is on
  the long-term roadmap with no committed timeline, and programmatic access is brokered
  through Zapier, Make and Pabbly connectors. It does, however, operate an undocumented
  but fully standards-discoverable Model Context Protocol server at
  socialbee.com/wp-json/mcp/mcp-oauth-server, guarded by OAuth 2.1 with PKCE and
  advertised via RFC 8414 and RFC 9728 metadata under /.well-known/. SocialBee was
  acquired by WebPros in August 2024.
